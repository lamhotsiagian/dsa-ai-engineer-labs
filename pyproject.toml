[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-ai-engineer-labs"
version = "1.0.0"
description = "Tested implementations and LeetCode solutions for DSA for AI Engineers"
authors = [{name = "Lamhot Siagian"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
